<style>
:root{--bg:linear-gradient(135deg,#0f0f1a,#1a1a2e,#16213e);--bg2:rgba(255,255,255,.04);--bd:rgba(255,255,255,.06);--txt:#e0e0e0;--txt2:#ccc;--txt3:#888;--card-bg:rgba(255,255,255,.04);--card-bd:rgba(255,255,255,.06);--input-bg:rgba(255,255,255,.06);--input-bd:rgba(255,255,255,.1);--input-txt:#fff;--toggle-bg:#333;--badge-on:rgba(76,175,80,.2);--badge-off:rgba(255,255,255,.06);--stat-val:#fff;--stat-lbl:#666;--btn-bg2:rgba(255,255,255,.08);--btn-bd2:rgba(255,255,255,.1);--footer:#555;--theme-icon:#888}
body.light{--bg:linear-gradient(135deg,#e3f0ff,#d4e8ff,#cce0ff);--bg2:rgba(0,0,0,.03);--bd:rgba(0,0,0,.08);--txt:#333;--txt2:#444;--txt3:#999;--card-bg:rgba(255,255,255,.7);--card-bd:rgba(255,255,255,.9);--input-bg:rgba(0,0,0,.04);--input-bd:rgba(0,0,0,.1);--input-txt:#333;--toggle-bg:#ccc;--badge-on:rgba(76,175,80,.15);--badge-off:rgba(0,0,0,.06);--stat-val:#333;--stat-lbl:#aaa;--btn-bg2:rgba(0,0,0,.04);--btn-bd2:rgba(0,0,0,.1);--footer:#bbb;--theme-icon:#666}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:20px;transition:background .3s,color .3s}
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#ff6b6b,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.header .bottom-row{display:flex;align-items:center;justify-content:center;position:relative}
.header .sub{font-size:12px;color:var(--txt3)}
.header .theme-row{display:flex;align-items:center;gap:4px;position:absolute;right:0}
.header .theme-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--card-bd);background:var(--card-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.header .theme-btn.active{border-color:#ff6b6b;background:rgba(255,107,107,.1);animation:themePop .3s ease-out}
@keyframes themePop{from{transform:scale(.85);opacity:.5}to{transform:scale(1);opacity:1}}
.header .theme-btn svg{width:16px;height:16px}
.stats{display:flex;gap:10px;margin-bottom:20px;animation:cardIn .4s ease-out;animation-delay:0s}
.stat{flex:1;background:var(--card-bg);border:1px solid var(--card-bd);border-radius:12px;padding:12px 10px;text-align:center;transition:background .3s,border .3s}
.stat .val{font-size:20px;font-weight:700;color:var(--stat-val)}
.stat .lbl{font-size:10px;color:var(--stat-lbl);margin-top:2px}
.card{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:16px;padding:18px;margin-bottom:12px;transition:background .3s,border .3s;animation:cardIn .4s ease-out both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#card-fan{animation-delay:.05s}
#card-charge{animation-delay:.1s}
#card-touch{animation-delay:.15s}
#card-bottom{animation-delay:.2s}
.card .title{font-size:15px;font-weight:600;color:var(--txt2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .title .emoji{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.toggle{position:relative;width:52px;height:28px;border-radius:14px;cursor:pointer;transition:all .3s;border:none;background:var(--toggle-bg);flex-shrink:0;outline:none}
.toggle.on{background:#4caf50}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:all .3s}
.toggle.on::after{transform:translateX(24px)}
.row{display:flex;align-items:center;justify-content:space-between}
.row .right{display:flex;align-items:center;gap:10px}
.setting-row{margin-top:12px;gap:8px;align-items:center}
.setting-row.off{opacity:.4;pointer-events:none;display:flex}
.setting-row.on{display:flex}
.setting-row input{flex:1;background:var(--input-bg);border:1px solid var(--input-bd);border-radius:8px;padding:8px 12px;color:var(--input-txt);font-size:14px;outline:none;width:60px;transition:background .3s,border .3s,color .3s}
.setting-row input:focus{border-color:#ff6b6b}
.setting-row input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--toggle-bg);border-radius:2px;flex:1;padding:0;border:none}
.setting-row input[type=range]::-webkit-slider-thumb{width:20px;height:20px;border-radius:50%;background:#ff6b6b;cursor:pointer;-webkit-appearance:none}
.setting-row .unit{color:var(--txt3);font-size:12px;white-space:nowrap}
.setting-row button{background:#ff6b6b;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.setting-row button:active{opacity:.8}
.sep-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin-right:8px}
.sep-badge.active{background:var(--badge-on);color:#4caf50}
.sep-badge.inactive{background:var(--badge-off);color:var(--txt3)}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#4caf50;color:#fff;padding:10px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#ff4444}
.sponsor-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center}
.sponsor-overlay.show{display:flex}
.sponsor-popup{background:var(--card-bg);border:1px solid var(--card-bd);border-radius:16px;padding:20px;text-align:center;max-width:320px;width:90%}
.sponsor-popup img{width:100%;border-radius:12px;margin-bottom:12px}
.sponsor-popup .close-btn{background:var(--btn-bg2);color:var(--txt2);border:1px solid var(--btn-bd2);border-radius:8px;padding:8px 24px;font-size:13px;cursor:pointer;margin-top:8px}
.bottom-btns button{flex:1;background:var(--btn-bg2);color:var(--txt2);border:1px solid var(--btn-bd2);border-radius:10px;padding:12px 8px;font-size:12px;cursor:pointer;transition:background .3s,border .3s,color .3s}
.footer{text-align:center;margin-top:20px;font-size:11px;color:var(--footer);transition:color .3s}
</style>

<script>
var CMD = '/data/adb/modules/FanExtreme/webui_cmd';
var STATUS = '/data/adb/modules/FanExtreme/webui_status';
var editingThreshold = false;
var editingFan = false;
var thresholdSaveTime = 0;
var thresholdSyncTimer = null;
var fanSaveTime = 0;
var fanSyncTimer = null;
var debounceTimers = {};
var toggleLocks = {fan:0, charge:0, touch:0};
var toggleExpected = {fan:null, charge:null, touch:null};

function debounce(key, fn, delay) {
  delay = delay || 300;
  if (debounceTimers[key]) { clearTimeout(debounceTimers[key]); }
  debounceTimers[key] = setTimeout(function(){
    delete debounceTimers[key];
    fn();
  }, delay);
}
var theme = 0; // 0=dark 1=light 2=auto

function applyTheme(t) {
  debounce('theme'+t, function(){
    theme = t;
  document.getElementById('themeDark').classList.toggle('active', t === 0);
  document.getElementById('themeLight').classList.toggle('active', t === 1);
  document.getElementById('themeAuto').classList.toggle('active', t === 2);
  if (t === 2) {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.body.classList.add('light');
    } else {
      document.body.classList.remove('light');
    }
  } else if (t === 1) {
    document.body.classList.add('light');
  } else {
    document.body.classList.remove('light');
  }
  localStorage.setItem('fanextreme_theme', t);
  }, 200);
}

// Init theme
(function(){
  var saved = localStorage.getItem('fanextreme_theme');
  var initial = saved !== null ? parseInt(saved) : 0;
  applyTheme(initial);
  if (initial === 2) {
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e){
      if (theme === 2) document.body.classList.toggle('light', e.matches);
    });
  }
})();

function ksuExec(cmd) {
  try {
    var r = ksu.exec(cmd);
    if (!r) return '';
    if (typeof r === 'string') return r.trim();
    if (r.stdout) return r.stdout.trim();
    if (r.out) return r.out.trim();
    if (r.result) return r.result.toString().trim();
    return '';
  } catch(e) { return ''; }
}

function execWebUI(action, value) {
  var d = JSON.stringify({action: action, value: value || ''});
  var esc = d.replace(/"/g, '\\"');
  var cmd = 'echo "' + esc + '" > ' + CMD;
  setTimeout(function(){ ksuExec(cmd); }, 0);
}

function showToast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(function(){ t.className = 'toast'; }, 2000);
}

function setToggle(btn, on) { btn.className = 'toggle' + (on ? ' on' : ' off'); }

function toggleFan() {
  debounce('fan', function(){
    var tgl = document.getElementById('fanToggle');
    var isOn = tgl.classList.contains('on');
    toggleExpected.fan = !isOn;
    setToggle(tgl, !isOn);
    toggleLocks.fan = Date.now() + 5000;
    execWebUI('auto_fan', isOn ? 'off' : 'on');
    showToast(!isOn ? '风扇控制已开启' : '风扇控制已关闭');
  });
}

function saveFanLevel() {
  debounce('fanLvl', function(){
    var v = document.getElementById('fanLevel').value;
    execWebUI('fan_level', v);
    editingFan = true;
    fanSaveTime = Date.now() + 4000;
    showToast('风扇挡位: ' + v);
  });
}

function toggleTouch() {
  debounce('touch', function(){
    var tgl = document.getElementById('touchToggle');
    var isOn = tgl.classList.contains('on');
    toggleExpected.touch = !isOn;
    setToggle(tgl, !isOn);
    toggleLocks.touch = Date.now() + 5000;
    execWebUI('touch_boost', isOn ? 'off' : 'on');
    showToast(!isOn ? '触控优化已开启' : '触控优化已关闭');
  });
}

function toggleCharge() {
  debounce('charge', function(){
    var tgl = document.getElementById('chargeToggle');
    var isOn = tgl.classList.contains('on');
    toggleExpected.charge = !isOn;
    setToggle(tgl, !isOn);
    toggleLocks.charge = Date.now() + 5000;
    execWebUI('auto_charge', isOn ? 'off' : 'on');
    showToast(!isOn ? '充电分离已开启' : '充电分离已关闭');
  });
}

function saveThreshold() {
  debounce('thresh', function(){
    var v = document.getElementById('thresholdVal').value;
    if (!v || v < 20 || v > 100) { showToast('阈值需在 20-100 之间', true); return; }
    execWebUI('threshold', v);
    editingThreshold = true;
    thresholdSaveTime = Date.now() + 4000;
    showToast('阈值已保存: ' + v + '%');
  });
}

function refresh() {
  var raw = ksuExec('cat ' + STATUS + ' 2>/dev/null');
  if (!raw) return;
  try {
    var s = JSON.parse(raw);

    if (s.battery) document.getElementById('batteryPct').textContent = s.battery + '%';
    if (s.temp_deg) document.getElementById('batteryTemp').textContent = s.temp_deg + '°C';
    document.getElementById('chargePower').textContent = s.power ? s.power + 'W' : '未充电';

    // ---- fan ----
    var fanCard = document.getElementById('card-fan');
    var fanBtn = document.getElementById('fanToggle');
    var fanRow = document.getElementById('fanRow');
    var fanStatus = document.getElementById('fanStatus');
    var fanInfo = document.getElementById('fanInfo');

    if (s.fan_enabled === 1) {
      fanCard.style.opacity = ''; fanCard.style.pointerEvents = '';
      fanBtn.style.display = '';
      var fanOn = s.auto_fan === 1;
      if (Date.now() < toggleLocks.fan && toggleExpected.fan !== null) {
        if (fanOn === toggleExpected.fan) { toggleLocks.fan = 0; toggleExpected.fan = null; }
      }
      if (Date.now() >= toggleLocks.fan) setToggle(fanBtn, fanOn);
      fanRow.className = 'setting-row ' + (fanOn ? 'on' : 'off');
      fanStatus.textContent = s.fan_level ? '挡位 ' + s.fan_level : '-';
      fanStatus.className = fanOn ? 'sep-badge active' : 'sep-badge inactive';
      fanInfo.textContent = fanOn ? '风扇当前挡位 ' + (s.fan_level || '-') : '风扇控制已关闭';
      if (s.fan_level) {
        clearTimeout(fanSyncTimer);
        fanSyncTimer = setTimeout(function(){
          if (!editingFan && Date.now() > fanSaveTime) {
            var el = document.getElementById('fanLevel');
            var elv = document.getElementById('fanLevelVal');
            if (el) el.value = s.fan_level;
            if (elv) elv.textContent = s.fan_level;
          }
        }, 1500);
      }
    } else {
      fanCard.style.opacity = '.4'; fanCard.style.pointerEvents = 'none';
      fanBtn.style.display = 'none';
      fanStatus.textContent = '未启用';
      fanStatus.className = 'sep-badge inactive';
      fanInfo.textContent = '请在config.txt内将风扇极速设为1后重启';
      fanRow.className = 'setting-row off';
    }

    // ---- touch ----
    var touchCard = document.getElementById('card-touch');
    var touchBtn = document.getElementById('touchToggle');
    var touchStatus = document.getElementById('touchStatus');
    var touchInfo = document.getElementById('touchInfo');

    if (s.touch_enabled === 1) {
      touchCard.style.opacity = ''; touchCard.style.pointerEvents = '';
      touchBtn.style.display = '';
      var touchOn = s.touch_boost === 1;
      if (Date.now() < toggleLocks.touch && toggleExpected.touch !== null) {
        if (touchOn === toggleExpected.touch) { toggleLocks.touch = 0; toggleExpected.touch = null; }
      }
      if (Date.now() >= toggleLocks.touch) setToggle(touchBtn, touchOn);
      touchStatus.textContent = touchOn ? '已优化' : '未优化';
      touchStatus.className = touchOn ? 'sep-badge active' : 'sep-badge inactive';
      touchInfo.textContent = touchOn ? '采样率已拉满，触控响应最大化' : '触控优化已关闭，使用系统默认';
    } else {
      touchCard.style.opacity = '.4'; touchCard.style.pointerEvents = 'none';
      touchBtn.style.display = 'none';
      touchStatus.textContent = '未启用';
      touchStatus.className = 'sep-badge inactive';
      touchInfo.textContent = '请在config.txt内将触控优化设为1后重启';
    }

    // ---- charge ----
    var chargeCard = document.getElementById('card-charge');
    var chargeBtn = document.getElementById('chargeToggle');
    var chargeRow = document.getElementById('thresholdRow');
    var sepStatus = document.getElementById('sepStatus');
    var chargeInfo = document.getElementById('chargeInfo');

    if (s.charge_enabled === 1) {
      chargeCard.style.opacity = ''; chargeCard.style.pointerEvents = '';
      chargeBtn.style.display = '';
      var autoOn = s.auto_charge === 1;
      if (Date.now() < toggleLocks.charge && toggleExpected.charge !== null) {
        if (autoOn === toggleExpected.charge) { toggleLocks.charge = 0; toggleExpected.charge = null; }
      }
      if (Date.now() >= toggleLocks.charge) setToggle(chargeBtn, autoOn);
      var sepOn = s.cs === '1' || s.cs === 1;
      sepStatus.textContent = sepOn ? '已分离' : '未分离';
      sepStatus.className = 'sep-badge ' + (sepOn ? 'active' : 'inactive');
      chargeRow.className = 'setting-row ' + (autoOn ? 'on' : 'off');
      if (autoOn) {
        chargeInfo.textContent = sepOn ? '电量≥'+s.threshold+'%，已自动分离' : '电量达到'+s.threshold+'%自动分离';
      } else {
        chargeInfo.textContent = '自动充电分离已关闭';
      }
      if (s.threshold) {
        clearTimeout(thresholdSyncTimer);
        thresholdSyncTimer = setTimeout(function(){
          if (!editingThreshold && Date.now() > thresholdSaveTime) {
            var el = document.getElementById('thresholdVal');
            if (el) el.value = s.threshold;
          }
        }, 1500);
      }
    } else {
      chargeCard.style.opacity = '.4'; chargeCard.style.pointerEvents = 'none';
      chargeBtn.style.display = 'none';
      sepStatus.textContent = '未启用';
      sepStatus.className = 'sep-badge inactive';
      chargeInfo.textContent = '请在config.txt内将充电分离设为1后重启';
      chargeRow.className = 'setting-row off';
    }

  } catch(e) {}
}
