<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FanExtreme</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f0f1a,#1a1a2e,#16213e);color:#e0e0e0;min-height:100vh;padding:20px}
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#ff6b6b,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:12px;color:#666;margin-top:4px}
.stats{display:flex;gap:10px;margin-bottom:20px}
.stat{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 10px;text-align:center}
.stat .val{font-size:20px;font-weight:700;color:#fff}
.stat .lbl{font-size:10px;color:#666;margin-top:2px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px;margin-bottom:12px}
.card .title{font-size:15px;font-weight:600;color:#ccc;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .title .emoji{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.toggle{position:relative;width:52px;height:28px;border-radius:14px;cursor:pointer;transition:all .3s;border:none;background:#333;flex-shrink:0;outline:none}
.toggle.on{background:#4caf50}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:all .3s}
.toggle.on::after{transform:translateX(24px)}
.row{display:flex;align-items:center;justify-content:space-between}
.row .right{display:flex;align-items:center;gap:10px}
.setting-row{margin-top:12px;gap:8px;align-items:center}
.setting-row.off{opacity:.4;pointer-events:none;display:flex}
.setting-row.on{display:flex}
.setting-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;outline:none;width:60px}
.setting-row input:focus{border-color:#ff6b6b}
.setting-row input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:#333;border-radius:2px;flex:1;padding:0;border:none}
.setting-row input[type=range]::-webkit-slider-thumb{width:20px;height:20px;border-radius:50%;background:#ff6b6b;cursor:pointer;-webkit-appearance:none}
.setting-row .unit{color:#888;font-size:12px;white-space:nowrap}
.setting-row button{background:#ff6b6b;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.setting-row button:active{opacity:.8}
.sep-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin-right:8px}
.sep-badge.active{background:rgba(76,175,80,.2);color:#4caf50}
.sep-badge.inactive{background:rgba(255,255,255,.06);color:#888}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#4caf50;color:#fff;padding:10px 24px;border-radius:24px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#ff4444}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#555}
</style>
</head>
<body>
<div class="header">
  <h1>FanExtreme</h1>
  <div class="sub">v2.0.1</div>
</div>

<div class="toast" id="toast"></div>

<div class="stats">
  <div class="stat"><div class="val" id="batteryPct">--</div><div class="lbl">电量</div></div>
  <div class="stat"><div class="val" id="batteryTemp">--</div><div class="lbl">温度</div></div>
  <div class="stat"><div class="val" id="chargePower">--</div><div class="lbl">充电功率</div></div>
</div>

<div class="card" id="card-fan">
  <div class="row">
    <div class="title">
      <div class="emoji" style="background:rgba(255,107,107,.15)">🌀</div>
      风扇极速
    </div>
    <div class="right">
      <span class="sep-badge inactive" id="fanStatus">-</span>
      <button class="toggle off" id="fanToggle" onclick="toggleFan()"></button>
    </div>
  </div>
  <div class="row" style="margin-top:8px">
    <span style="font-size:12px;color:#888" id="fanInfo">等待同步...</span>
  </div>
  <div class="setting-row off" id="fanRow">
    <span class="unit">挡位</span>
    <input type="range" id="fanLevel" min="1" max="5" value="5" oninput="document.getElementById('fanLevelVal').textContent=this.value">
    <span class="unit" id="fanLevelVal">5</span>
    <button onclick="saveFanLevel()">保存</button>
  </div>
</div>

<div class="card" id="card-charge">
  <div class="row">
    <div class="title">
      <div class="emoji" style="background:rgba(255,217,61,.15)">⚡</div>
      充电分离
    </div>
    <div class="right">
      <span class="sep-badge inactive" id="sepStatus">未分离</span>
      <button class="toggle off" id="chargeToggle" onclick="toggleCharge()"></button>
    </div>
  </div>
  <div class="row" style="margin-top:8px">
    <span style="font-size:12px;color:#888" id="chargeInfo">等待同步...</span>
  </div>
  <div class="setting-row off" id="thresholdRow">
    <span class="unit">触发阈值</span>
    <input type="number" id="thresholdVal" min="20" max="100" placeholder="100" inputmode="numeric">
    <span class="unit">%</span>
    <button onclick="saveThreshold()">保存</button>
  </div>
</div>

<div class="card" style="text-align:center">
  <div style="display:flex;gap:10px">
    <button onclick="genLog()" style="flex:1;background:rgba(255,255,255,.08);color:#ccc;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;font-size:13px;cursor:pointer">📋 生成调试日志</button>
    <button onclick="joinQQ()" style="flex:1;background:rgba(255,255,255,.08);color:#ccc;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;font-size:13px;cursor:pointer">💬 加入QQ群</button>
  </div>
</div>

<div class="footer">MIT © 酷安@ling_凌</div>

<script>
var CMD = '/data/adb/modules/FanExtreme/webui_cmd';
var STATUS = '/data/adb/modules/FanExtreme/webui_status';
var editingThreshold = false;
var editingFan = false;

function ksuExec(cmd) {
  try {
    var r = ksu.exec(cmd);
    if (!r) return '';
    if (typeof r === 'string') return r.trim();
    if (r.stdout) return r.stdout.trim();
    if (r.out) return r.out.trim();
    if (r.result) return r.result.toString().trim();
    return '';
  } catch(e) { return ''; }
}

function execWebUI(action, value) {
  var d = JSON.stringify({action: action, value: value || ''});
  var esc = d.replace(/"/g, '\\"');
  ksuExec('echo "' + esc + '" > ' + CMD);
}

function showToast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(function(){ t.className = 'toast'; }, 2000);
}

function setToggle(btn, on) { btn.className = 'toggle' + (on ? ' on' : ' off'); }

function toggleFan() {
  var tgl = document.getElementById('fanToggle');
  var isOn = tgl.classList.contains('on');
  execWebUI('auto_fan', isOn ? 'off' : 'on');
  showToast(isOn ? '已关闭风扇控制' : '已开启风扇控制');
}

function saveFanLevel() {
  var v = document.getElementById('fanLevel').value;
  execWebUI('fan_level', v);
  showToast('风扇挡位: ' + v);
}

function toggleCharge() {
  var tgl = document.getElementById('chargeToggle');
  var isOn = tgl.classList.contains('on');
  execWebUI('auto_charge', isOn ? 'off' : 'on');
  showToast(isOn ? '已关闭自动充电分离' : '已开启自动充电分离');
}

function saveThreshold() {
  var v = document.getElementById('thresholdVal').value;
  if (!v || v < 20 || v > 100) { showToast('阈值需在 20-100 之间', true); return; }
  execWebUI('threshold', v);
  showToast('阈值已保存: ' + v + '%');
}

function refresh() {
  var raw = ksuExec('cat ' + STATUS + ' 2>/dev/null');
  if (!raw) return;
  try {
    var s = JSON.parse(raw);

    // Stats
    if (s.battery) document.getElementById('batteryPct').textContent = s.battery + '%';
    if (s.temp_deg) document.getElementById('batteryTemp').textContent = s.temp_deg + '°C';
    document.getElementById('chargePower').textContent = s.power ? s.power + 'W' : '未充电';

    // ---- 风扇 ----
    var fanCard = document.getElementById('card-fan');
    var fanBtn = document.getElementById('fanToggle');
    var fanRow = document.getElementById('fanRow');
    var fanStatus = document.getElementById('fanStatus');
    var fanInfo = document.getElementById('fanInfo');
    var fanLevelInput = document.getElementById('fanLevel');
    var fanLevelVal = document.getElementById('fanLevelVal');

    if (s.fan_enabled === 1) {
      fanCard.style.opacity = ''; fanCard.style.pointerEvents = '';
      fanBtn.style.display = '';
      var fanOn = s.auto_fan === 1;
      setToggle(fanBtn, fanOn);
      fanRow.className = 'setting-row ' + (fanOn ? 'on' : 'off');
      fanStatus.textContent = s.fan_level ? '挡位 ' + s.fan_level : '-';
      fanStatus.className = fanOn ? 'sep-badge active' : 'sep-badge inactive';
      fanInfo.textContent = fanOn ? '风扇当前挡位 ' + (s.fan_level || '-') : '风扇控制已关闭';
      if (!editingFan && s.fan_level) {
        fanLevelInput.value = s.fan_level;
        fanLevelVal.textContent = s.fan_level;
      }
    } else {
      fanCard.style.opacity = '.4'; fanCard.style.pointerEvents = 'none';
      fanBtn.style.display = 'none';
      fanStatus.textContent = '未启用';
      fanStatus.className = 'sep-badge inactive';
      fanInfo.textContent = '请在config.txt内将风扇极速设为1后重启';
      fanRow.className = 'setting-row off';
    }

    // ---- 充电分离 ----
    var chargeCard = document.getElementById('card-charge');
    var chargeBtn = document.getElementById('chargeToggle');
    var chargeRow = document.getElementById('thresholdRow');
    var sepStatus = document.getElementById('sepStatus');
    var chargeInfo = document.getElementById('chargeInfo');
    var thresholdVal = document.getElementById('thresholdVal');

    if (s.charge_enabled === 1) {
      chargeCard.style.opacity = ''; chargeCard.style.pointerEvents = '';
      chargeBtn.style.display = '';
      var autoOn = s.auto_charge === 1;
      setToggle(chargeBtn, autoOn);
      var sepOn = s.cs === '1' || s.cs === 1;
      sepStatus.textContent = sepOn ? '已分离' : '未分离';
      sepStatus.className = 'sep-badge ' + (sepOn ? 'active' : 'inactive');
      chargeRow.className = 'setting-row ' + (autoOn ? 'on' : 'off');
      if (autoOn) {
        chargeInfo.textContent = sepOn ? '电量≥'+s.threshold+'%，已自动分离' : '电量达到'+s.threshold+'%自动分离';
      } else {
        chargeInfo.textContent = '自动充电分离已关闭';
      }
      if (!editingThreshold && s.threshold) thresholdVal.value = s.threshold;
    } else {
      chargeCard.style.opacity = '.4'; chargeCard.style.pointerEvents = 'none';
      chargeBtn.style.display = 'none';
      sepStatus.textContent = '未启用';
      sepStatus.className = 'sep-badge inactive';
      chargeInfo.textContent = '请在config.txt内将充电分离设为1后重启';
      chargeRow.className = 'setting-row off';
    }

  } catch(e) {}
}

document.getElementById('thresholdVal').addEventListener('focus', function(){ editingThreshold = true; });
document.getElementById('fanLevel').addEventListener('touchstart', function(){ editingFan = true; });
document.getElementById('fanLevel').addEventListener('mousedown', function(){ editingFan = true; });
document.addEventListener('click', function(e){ if (e.target.id !== 'fanLevel') editingFan = false; });
document.addEventListener('click', function(e){ if (e.target.id !== 'thresholdVal') editingThreshold = false; });

refresh();
setInterval(refresh, 2000);

function genLog() {
  var LOG = '/sdcard/Download/FanExtreme_debug.log';
  ksuExec('echo "=== FanExtreme v2.0.1 调试日志 ===" > ' + LOG);
  ksuExec('echo "时间: $(date)" >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[module.prop]" >> ' + LOG);
  ksuExec('cat /data/adb/modules/FanExtreme/module.prop >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[config.txt]" >> ' + LOG);
  ksuExec('cat /data/adb/modules/FanExtreme/config.txt >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[webui_status]" >> ' + LOG);
  ksuExec('cat ' + STATUS + ' >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[service.sh进程]" >> ' + LOG);
  ksuExec('ps -ef | grep FanExtreme >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[sysfs充电节点]" >> ' + LOG);
  ksuExec('cat /sys/class/qcom-battery/restrict_cur /sys/class/qcom-battery/restrict_chg /sys/class/qcom-battery/charging_enabled /sys/class/qcom-battery/charge_mode >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[充电分离状态]" >> ' + LOG);
  ksuExec('settings get global charge_separation_switch >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[GPU]" >> ' + LOG);
  ksuExec('cat /sys/kernel/gpu/gpu_model /sys/kernel/gpu/gpu_clock /sys/kernel/gpu/gpu_max_clock /sys/kernel/gpu/gpu_min_clock /sys/kernel/gpu/gpu_busy >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[风扇]" >> ' + LOG);
  ksuExec('cat /sys/kernel/fan/fan_speed_level /sys/kernel/fan/fan_enable >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[设备信息]" >> ' + LOG);
  ksuExec('getprop ro.product.model >> ' + LOG);
  ksuExec('getprop ro.product.board >> ' + LOG);
  ksuExec('getprop ro.build.version.release >> ' + LOG);
  ksuExec('getprop ro.build.version.sdk >> ' + LOG);
  ksuExec('uname -r >> ' + LOG);
  ksuExec('echo "" >> ' + LOG);
  ksuExec('echo "[CPU]" >> ' + LOG);
  ksuExec('echo "governor: $(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)" >> ' + LOG);
  ksuExec('for c in /sys/devices/system/cpu/cpu*/cpufreq; do echo "$(basename $(dirname $c)): cur=$(cat $c/scaling_cur_freq 2>/dev/null) min=$(cat $c/scaling_min_freq 2>/dev/null) max=$(cat $c/scaling_max_freq 2>/dev/null)"; done >> ' + LOG);
  showToast('已输出到Download文件夹下');
}

function joinQQ() {
  ksuExec('am start -a android.intent.action.VIEW -d https://qm.qq.com/q/QCBSaor22k');
  showToast('正在打开浏览器...');
}
</script>
</body>
</html>
