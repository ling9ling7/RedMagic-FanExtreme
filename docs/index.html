<script>
(async function () {
  const REPO = 'ling9ling7/RedMagic-FanExtreme';
  const starsEl = document.getElementById('starsValue');
  const forksEl = document.getElementById('forksValue');
  const versionEl = document.getElementById('versionText');
  const syncDot = document.getElementById('syncDot');
  const syncInfo = document.getElementById('syncInfo');

  function fmt(n) { return Number(n).toLocaleString('en-US'); }

  let version = null;

  // Step 1: module.prop (raw CDN, no rate limit)
  try {
    const propRes = await fetch(`https://raw.githubusercontent.com/${REPO}/main/module.prop`);
    if (propRes.ok) {
      const propText = await propRes.text();
      const verMatch = propText.match(/version\s*=\s*([\d.]+)/);
      if (verMatch) version = verMatch[1];
    }
  } catch (e) {}

  // Step 2: fallback to tags
  if (!version) {
    try {
      const tagsRes = await fetch(`https://api.github.com/repos/${REPO}/tags`);
      if (tagsRes.ok) {
        const tags = await tagsRes.json();
        if (tags.length > 0) version = tags[0].name;
      }
    } catch (e) {}
  }

  // Step 3: hardcoded fallback
  if (!version) version = '2.0.2';

  versionEl.textContent = 'v' + version;
  syncDot.style.display = 'inline-block';

  // Repo stats (API, may fail)
  try {
    const repoRes = await fetch(`https://api.github.com/repos/${REPO}`);
    if (repoRes.ok) {
      const repo = await repoRes.json();
      starsEl.textContent = '\u2b50 ' + fmt(repo.stargazers_count);
      forksEl.textContent = fmt(repo.forks_count);
      if (repo.description) {
        document.getElementById('heroDesc').textContent = repo.description;
      }
      syncInfo.textContent = '\u6570\u636e\u6700\u540e\u66f4\u65b0: ' + new Date().toLocaleString('zh-CN');
    } else {
      throw new Error('not ok');
    }
  } catch (e) {
    starsEl.textContent = '\u2b50 7';
    forksEl.textContent = '0';
    syncInfo.textContent = 'GitHub API \u4e0d\u53ef\u7528\uff0c\u663e\u793a\u7f13\u5b58\u6570\u636e';
  }
})();
</script>
